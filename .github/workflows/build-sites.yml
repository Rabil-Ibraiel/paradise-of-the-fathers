name: Build editorial deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Sites worker
        run: npm run build

      - name: Upload verified worker artifact
        uses: actions/upload-artifact@v6
        with:
          name: sites-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
